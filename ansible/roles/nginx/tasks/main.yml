---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy Moodle Nginx virtual host
  template:
    src: moodle.conf.j2
    dest: /etc/nginx/sites-available/moodle.conf
    mode: "0644"
  notify: Reload nginx

- name: Enable Moodle Nginx site
  file:
    src: /etc/nginx/sites-available/moodle.conf
    dest: /etc/nginx/sites-enabled/moodle.conf
    state: link
  notify: Reload nginx

- name: Ensure Nginx is running
  service:
    name: nginx
    state: started
    enabled: true

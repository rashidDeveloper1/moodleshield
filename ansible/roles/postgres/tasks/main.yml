---
- name: Add PostgreSQL APT signing key
  ansible.builtin.apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Add PostgreSQL 17 APT repository
  ansible.builtin.apt_repository:
    repo: "deb https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Install PostgreSQL 17
  ansible.builtin.apt:
    name:
      - postgresql-17
      - postgresql-client-17
      - python3-psycopg2
    state: present
    update_cache: true

- name: Ensure PostgreSQL service is running
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create Moodle PostgreSQL user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ pg_user }}"
    password: "{{ pg_pass }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE

- name: Create Moodle database owned by moodle user
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ pg_db }}"
    owner: "{{ pg_user }}"
    encoding: UTF8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8

- name: Restrict pg_hba to local connections only
  ansible.builtin.lineinfile:
    path: /etc/postgresql/17/main/pg_hba.conf
    regexp: "^host\\s+all\\s+all\\s+0\\.0\\.0\\.0/0"
    line: "# remote access disabled by MoodleShield hardening"
  notify: Restart postgresql

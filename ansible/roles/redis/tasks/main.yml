---
- name: Install Redis
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: true

- name: Configure Redis security settings
  ansible.builtin.lineinfile:
    path: /etc/redis/redis.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: "^bind ", line: "bind 127.0.0.1" }
    - { regexp: "^# requirepass ", line: "requirepass {{ redis_requirepass }}" }
    - { regexp: "^requirepass ", line: "requirepass {{ redis_requirepass }}" }
    - { regexp: "^maxmemory ", line: "maxmemory 256mb" }
    - { regexp: "^maxmemory-policy ", line: "maxmemory-policy allkeys-lru" }
  notify: Restart redis

- name: Ensure Redis is running
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true
